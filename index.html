<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Revise My Chess — the cabin</title>
<meta name="description" content="Review your chess.com games in a candlelit 3D cabin: replay your blunders, step through games, rebuild a flung board from memory, or play blindfolded against the pawn." />
<meta name="theme-color" content="#0c0c0f" />
<meta property="og:title" content="Revise My Chess — the cabin" />
<meta property="og:description" content="Fix your blunders, step through your games, or take on the pawn's mental challenges — in a candlelit 3D cabin." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://raw.githubusercontent.com/aaronparsons108/ReviseMyChess/main/assets/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://raw.githubusercontent.com/aaronparsons108/ReviseMyChess/main/assets/og.jpg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='82' font-size='80'>♟</text></svg>" />
<script type="importmap">
{ "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
</script>
</head>
<body>
<canvas id="webgl"></canvas>

<!-- floating verdict labels rendered over the canvas -->
<div id="fx" aria-hidden="true"></div>

<!-- the host's voice -->
<div id="host-speech" class="speech" hidden><span id="speech-text"></span></div>

<!-- corner controls -->
<div id="corner">
  <button id="btn-modes" class="rune-btn" title="Switch modes" hidden>☰ modes</button>
  <button id="btn-rename" class="rune-btn" title="Give a different name" hidden>✎ name</button>
  <button id="btn-sound" class="rune-btn" title="Toggle sound">♪</button>
</div>

<!-- mode switcher: jump straight to any of the four modes -->
<div id="nav-overlay" class="modal" hidden>
  <div class="parchment scrap mode-card">
    <p>Where to, <span id="nav-name-label" class="q"></span>?</p>
    <div class="mode-choices nav-grid">
      <button class="ink-btn go" id="nav-fix">⚔ Fix Mistakes<small>replay your blunders</small></button>
      <button class="ink-btn" id="nav-review">📖 Simple Review<small>step through a game</small></button>
      <button class="ink-btn" id="nav-shaker">🌀 Board Shaker<small>rebuild from memory</small></button>
      <button class="ink-btn" id="nav-blind">🩸 Blindfolded<small>play unseen</small></button>
    </div>
    <div class="nav-links">
      <button class="link-btn" id="nav-games">📜 choose another game</button>
      <button class="link-btn" id="nav-name">✎ change name</button>
      <button class="link-btn" id="nav-close">✕ close</button>
    </div>
  </div>
</div>

<!-- start menu: which kind of session -->
<div id="start-overlay" class="modal" hidden>
  <div class="start-brand">
    <h1 class="boot-title small">Revise <span class="bt-red">My</span> Chess</h1>
    <div class="boot-tag">the pawn is waiting.</div>
  </div>
  <div class="parchment scrap mode-card">
    <p id="start-title">What shall we do tonight?</p>
    <div class="mode-choices">
      <button class="ink-btn go" id="btn-track-study">📖 Study Games<small>review your real games</small></button>
      <button class="ink-btn" id="btn-track-mental">🧠 Mental Challenges<small>test your memory &amp; nerve</small></button>
    </div>
  </div>
</div>

<!-- mental-challenge picker -->
<div id="mental-overlay" class="modal" hidden>
  <div class="parchment scrap mode-card">
    <p id="mental-title">Choose your torment.</p>
    <div class="mode-choices">
      <button class="ink-btn go" id="btn-mental-shaker">🌀 Board Shaker<small>rebuild the position from memory</small></button>
      <button class="ink-btn" id="btn-mental-blind">🩸 Blindfolded<small>play with the pieces unseen</small></button>
    </div>
    <button class="link-btn" id="btn-mental-back">← back</button>
  </div>
</div>

<!-- blindfold red tint (see-through, clicks pass through) -->
<div id="blindfold" class="blindfold" hidden aria-hidden="true"></div>

<!-- board-shaker / blindfold HUD (bottom) -->
<div id="challenge-hud" class="parchment" hidden>
  <div id="challenge-msg" class="challenge-msg"></div>
  <div class="hud-actions">
    <button class="ink-btn" id="btn-peek" hidden>👁 peek (1s)</button>
    <button class="ink-btn" id="btn-challenge-retry" hidden>↺ again</button>
    <button class="link-btn" id="btn-challenge-exit">✕ leave</button>
  </div>
</div>

<!-- username prompt (parchment scrap) -->
<div id="username-panel" class="parchment scrap" hidden>
  <form id="username-form" autocomplete="off">
    <label for="username-input">Tell me your chess.com name</label>
    <div class="field-row">
      <input id="username-input" type="text" placeholder="chess.com username" spellcheck="false" required />
      <button type="submit" id="username-go" class="ink-btn">tell him →</button>
    </div>
    <p id="username-error" class="err" hidden></p>
  </form>
</div>

<!-- quiz HUD (parchment strip) -->
<div id="quiz-hud" class="parchment" hidden>
  <div class="hud-top">
    <span id="hud-counter"></span>
    <span id="hud-turn"></span>
  </div>
  <div id="hud-feedback" class="hud-feedback"></div>
  <div id="hud-engine-line" class="hud-engine-line"></div>
  <div id="hud-graph" class="hud-graph"></div>
  <div id="hud-actions">
    <button class="ink-btn" id="btn-hint">✦ hint</button>
    <button class="ink-btn" id="btn-idk">I don't know</button>
    <button class="ink-btn" id="btn-retry" hidden>↺ try again</button>
    <button class="ink-btn good" id="btn-accept" hidden>keep it →</button>
    <button class="ink-btn go" id="btn-next" hidden>next →</button>
  </div>
  <div class="hud-hint">←&nbsp;back&nbsp;·&nbsp;→&nbsp;next</div>
  <button class="link-btn" id="btn-to-review">↔ step through this game instead</button>
</div>

<!-- game notation (bottom, for fix mistakes) -->
<div id="quiz-notation" class="parchment quiz-notation" hidden></div>

<!-- mode picker -->
<div id="mode-overlay" class="modal" hidden>
  <div class="parchment scrap mode-card">
    <p id="mode-title">How shall we look at this game?</p>
    <div class="mode-choices">
      <button class="ink-btn go" id="btn-mode-fix">⚔ Fix Mistakes<small>find &amp; replay your blunders</small></button>
      <button class="ink-btn" id="btn-mode-review">📖 Simple Review<small>step through it move by move</small></button>
    </div>
    <button class="link-btn" id="btn-mode-back">← back to games</button>
  </div>
</div>

<!-- simple-review HUD -->
<div id="review-hud" class="parchment" hidden>
  <div id="rev-move" class="rev-move"></div>
  <div id="rev-line" class="rev-line"></div>
  <div class="hud-hint">←&nbsp;back&nbsp;·&nbsp;→&nbsp;forward&nbsp;·&nbsp;drag a piece to explore</div>
  <button class="link-btn" id="btn-rev-exit">✕ leave review</button>
</div>

<!-- vertical eval bar (review + fix mistakes) -->
<div id="evalbar" class="evalbar" hidden>
  <div class="eb-fill" id="eb-fill"></div>
  <div class="eb-zero"></div>
  <div class="eb-num" id="eb-num">0.0</div>
</div>

<!-- promotion picker -->
<div id="promo-modal" class="modal" hidden>
  <div class="parchment scrap">
    <p>Carve it into…</p>
    <div id="promo-choices" class="promo-choices"></div>
  </div>
</div>

<!-- boot + status -->
<div id="toast" class="toast" hidden></div>
<div id="boot" class="boot">
  <div class="boot-inner">
    <span class="boot-flame">🕯</span>
    <h1 class="boot-title">Revise <span class="bt-red">My</span> Chess</h1>
    <div class="boot-sub">— the cabin —</div>
    <div class="boot-note">lighting the candles…</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
