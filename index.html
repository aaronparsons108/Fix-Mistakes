<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Revise My Chess — the cabin</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='82' font-size='80'>♟</text></svg>" />
</head>
<body>
<canvas id="webgl"></canvas>

<!-- floating verdict labels rendered over the canvas -->
<div id="fx" aria-hidden="true"></div>

<!-- the host's voice -->
<div id="host-speech" class="speech" hidden><span id="speech-text"></span></div>

<!-- corner controls -->
<div id="corner">
  <button id="btn-rename" class="rune-btn" title="Give a different name" hidden>✎ name</button>
  <button id="btn-sound" class="rune-btn" title="Toggle sound">♪</button>
</div>

<!-- username prompt (parchment scrap) -->
<div id="username-panel" class="parchment scrap" hidden>
  <form id="username-form" autocomplete="off">
    <label for="username-input">Whisper thy chess.com name</label>
    <div class="field-row">
      <input id="username-input" type="text" placeholder="chess.com username" spellcheck="false" required />
      <button type="submit" id="username-go" class="ink-btn">tell him →</button>
    </div>
    <p id="username-error" class="err" hidden></p>
  </form>
</div>

<!-- quiz HUD (parchment strip) -->
<div id="quiz-hud" class="parchment" hidden>
  <div class="hud-top">
    <span id="hud-counter"></span>
    <span id="hud-turn"></span>
  </div>
  <div id="hud-feedback" class="hud-feedback"></div>
  <div id="hud-eval" class="hud-eval"></div>
  <div id="hud-actions">
    <button class="ink-btn" id="btn-hint">✦ hint</button>
    <button class="ink-btn" id="btn-idk">I don't know</button>
    <button class="ink-btn" id="btn-retry" hidden>↺ try again</button>
    <button class="ink-btn good" id="btn-accept" hidden>keep it →</button>
    <button class="ink-btn go" id="btn-next" hidden>next →</button>
  </div>
  <div class="hud-hint">←&nbsp;retry&nbsp;·&nbsp;→&nbsp;next</div>
</div>

<!-- promotion picker -->
<div id="promo-modal" class="modal" hidden>
  <div class="parchment scrap">
    <p>Carve it into…</p>
    <div id="promo-choices" class="promo-choices"></div>
  </div>
</div>

<!-- boot + status -->
<div id="toast" class="toast" hidden></div>
<div id="boot" class="boot"><span class="boot-flame">🕯</span> lighting the candles…</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
